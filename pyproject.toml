[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clusters-ascended"
version = "0.1.0"
description = "Clusters Ascended: define ARK: Survival Ascended clusters, add maps, run them safely on one host (pytincture + wapyt)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13,<3.15"
authors = [{ name = "OldManGan", email = "eliguana@protonmail.com" }]
dependencies = [
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30.0",
    "pytincture==1.0.0",
    "wapyt",
]

[project.urls]
homepage = "https://github.com/El-Iguana/clustersascended_wapyt"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
# A built wheel, not editable, as in the sibling apps. Re-run
# `uv sync --reinstall-package wapyt` after changing wapyt's Python wrappers;
# asset edits go through its scripts/dev_wheel.sh.
wapyt = { path = "../wa_pytincture_widgetset", editable = false }

[tool.setuptools]
py-modules = ["service"]

[tool.clusters_ascended]
# The wa_pytincture_widgetset commit this app is built against (wapyt 0.3.0).
wapyt-ref = "44d37bb076ed8d693222067fe844985062ce691a"
